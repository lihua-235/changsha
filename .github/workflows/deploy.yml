# 把 web/ 构建产物自动发布到 GitHub Pages
#
# 触发：推送到 main，或在 Actions 页手动运行
#
# 前提（只需做一次，且必须在 GitHub 网页上手动完成）：
#   Settings → Pages → Build and deployment → Source 选择「GitHub Actions」
#   没启用 Pages 时，configure-pages 会直接失败（令牌无权限创建 Pages 站点）。

name: Deploy web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署，避免并发写坏 Pages
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 跑行程算法测试
        run: npm test

      - name: 构建
        # npm run build 会先执行 prebuild（重新生成 demo-itinerary.json）
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
